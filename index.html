<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Freemium — Free Online Developer Tools (JSON, JWT, Base64, Regex…)</title>
    <meta name="description" content="41 free developer tools: JSON formatter, JWT debugger, Base64, regex tester, diff checker, hash generator, UUID, cron parser and more. Private: everything runs in your browser.">
    <link rel="canonical" href="https://freemium.incentius.com/">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <meta name="apple-mobile-web-app-title" content="Freemium">

    <meta name="msapplication-tap-highlight" content="no">
    <!-- Zoom stays enabled (HIG › Accessibility: support text enlargement to 200%). viewport-fit=cover for safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg">

    <link rel="apple-touch-icon" href="/icons/favicon-128x128.png">

    <!-- Apply the saved appearance before first paint to avoid a flash -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('freemium:theme'));
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
